{% extends "base.html" %}

{% block title %}
    Hermes
{% endblock %}

{% block body %}
    <script type="text/javascript">
        var intervalID = setInterval(update_values, 1000);

        function update_values() {
            $.getJSON($SCRIPT_ROOT + '/update',

          function(data) {
            $('#current_time').text('Current time: '+data.current_time);
            $('#condition').text('Looking to '+data.condition);
            $('#crypto_currency').text('for '+data.fiat_currency+'.');
            $('#fiat_currency').text(''+data.crypto_currency);
            $('#crypto_balance').text('Asset A: '+data.crypto_balance);
            $('#fiat_balance').text('Asset B: '+data.fiat_balance);
            $('#trend_24h').text('24h trend: '+data.trend_24h);
            $('#buy_flag_4h').text('4h buy flag: '+data.buy_flag_4h);
            $('#sell_flag_4h').text('4h sell flag: '+data.sell_flag_4h);
            $('#trend_4h').text('4h trend: '+data.trend_4h);
            $('#buy_flag_1h').text('1h buy flag: '+data.buy_flag_1h);
            $('#sell_flag_1h').text('1h sell flag: '+data.sell_flag_1h);
            $('#trend_1h').text('1h trend: '+data.trend_1h);
            $('#buy_flag_15m').text('15min buy flag: '+data.buy_flag_15m);
            $('#sell_flag_15m').text('15min sell flag: '+data.sell_flag_15m);
            $('#price').text('Closing price: '+data.price);
            $('#pillow').text('Pillow: '+data.pillow);
            $('#limit').text('Buy limit: '+data.limit);
            $('#stop').text('Stop loss: '+data.stop);
            $('#log').text(data.log);
            console.log(data)
          });
        };
    </script>
        <span id="current_time"></span>
        <br>
        <span id="condition"></span>
        <span id="fiat_currency"></span>
        <span id="crypto_currency"></span>
        <br>
        <br>
        <p>Balance: </p>
        <span id="crypto_balance"></span>
        <span id="fiat_balance"></span>
        <br>
        <br>
        <span id="trend_24h"></span>
        <span id="buy_flag_4h"></span>
        <span id="sell_flag_4h"></span>
        <br>
        <span id="trend_4h"></span>
        <span id="buy_flag_1h"></span>
        <span id="sell_flag_1h"></span>
        <br>
        <span id="trend_1h"></span>
        <span id="buy_flag_15m"></span>
        <span id="sell_flag_15m"></span>
        <br>
        <br>
        <span id="price"></span>
        <br>
        <span id="pillow"></span>
        <br>
        <span id="limit"></span>
        <br>
        <span id="stop"></span>
        <br>
        <span id="log"></span>
        <br>
        <a href='/stop'><input type='button' value='Stop bot'></a>
        <a href='/cancel'><input type='button' value='Cancel active order'></a>
{% endblock %}
