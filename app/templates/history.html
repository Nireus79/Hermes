{% extends "base.html" %}

{% block title %}
    History
{% endblock %}

{% block body %}
    <script type="text/javascript">
        var intervalID = setInterval(update_values, 1000);

        function update_values() {
            $.getJSON($SCRIPT_ROOT + '/update',

          function(data) {

            $('#logs').html(data.logs);
            $('#trades').html(data.trades);

            console.log(data)
          });
        };
    </script>
        <h4>Trades</h4>
        <div id="trades"></div>
        <h4>Events</h4>
        <div id="logs"></div>
{% endblock %}
